<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{% block title %}busypanel{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
{% block head %}{% endblock %}
<noscript><style>dialog{display:block;position:static;margin:14px 0;max-width:none;padding:0;border:0;color:inherit;background:none}dialog::backdrop{display:none}</style></noscript>
</head>
<body>
<nav class="noprint">
  <a href="/" class="brand">{{ s.business_name or "busypanel" }}</a>
  <a class="navlink{% if active == 'home' %} on{% endif %}" href="/">Uninvoiced</a>
  <a class="navlink{% if active == 'clients' %} on{% endif %}" href="/clients">Clients</a>
  <a class="navlink{% if active == 'videos' %} on{% endif %}" href="/videos">Videos</a>
  <a class="navlink{% if active == 'invoices' %} on{% endif %}" href="/invoices">Invoices</a>
  <a class="navlink{% if active == 'expenses' %} on{% endif %}" href="/expenses">Expenses</a>
  <a class="navlink{% if active == 'summary' %} on{% endif %}" href="/summary">Summary</a>
  <a class="navlink{% if active == 'settings' %} on{% endif %}" href="/settings">Settings</a>
  <span class="spacer"></span>
  {% if auth_enabled() %}
  <form method="post" action="/logout" class="inline">
    <button class="btn btn-sm">Log out</button></form>
  {% endif %}
</nav>
<main class="wrap">
  <div id="flash" data-region="flash">{% block flash %}{% endblock %}</div>
  {% block body %}{% endblock %}
</main>
<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
