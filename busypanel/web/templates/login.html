{% extends "base.html" %}
{% block title %}log in · busypanel{% endblock %}
{% block flash %}
{% if error %}<p class="error" data-flash>Wrong password.</p>{% endif %}
{% endblock %}
{% block body %}
<div class="panel" style="max-width:22rem;margin:0 auto">
  <h1>BusyPanel</h1>
  <p class="page-sub">client videos · invoices · expenses</p>
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Password
      <input name="password" type="password" autofocus required></label>
    <div class="actions" style="margin-top:18px">
      <button type="submit" class="btn-primary">Log in</button>
    </div>
  </form>
  <p class="meta">Set at the server with <code>AUTH_PASSWORD</code> or
    <code>busypanel passwd</code>.</p>
</div>
{% endblock %}
